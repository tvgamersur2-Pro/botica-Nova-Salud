; ============================================================
; pgBouncer configuration for Nova Salud
; Requirements: NFR-1.3 (connection pooling, 20 concurrent users)
; ============================================================

[databases]
; Primary database connection
; Replace host/port/dbname with actual values or use environment substitution
nova_salud = host=${DB_HOST} port=${DB_PORT} dbname=${DB_NAME}

[pgbouncer]
; ----------------------------------------------------------------
; Network settings
; ----------------------------------------------------------------
listen_addr   = 127.0.0.1
listen_port   = 6432
unix_socket_dir = /var/run/postgresql

; ----------------------------------------------------------------
; Authentication
; ----------------------------------------------------------------
auth_type     = md5
auth_file     = /etc/pgbouncer/userlist.txt

; ----------------------------------------------------------------
; Pool mode
; transaction mode: connection returned to pool after each transaction
; Recommended for web applications with short-lived transactions
; ----------------------------------------------------------------
pool_mode     = transaction

; ----------------------------------------------------------------
; Pool sizing
; NFR-1.3: support 20 concurrent users
; ----------------------------------------------------------------
; Maximum connections to PostgreSQL server
server_pool_size      = 25

; Maximum client connections pgBouncer will accept
max_client_conn       = 100

; Default pool size per database/user pair
default_pool_size     = 20

; Minimum pool size (kept alive even when idle)
min_pool_size         = 2

; Reserve pool for emergency connections
reserve_pool_size     = 5

; Time (seconds) to wait before using reserve pool
reserve_pool_timeout  = 3.0

; ----------------------------------------------------------------
; Timeouts
; ----------------------------------------------------------------
; Time to wait for a server connection (seconds)
server_connect_timeout  = 5

; Time to wait for a query to complete (seconds)
; NFR-1.1: queries should complete within 1-2 seconds
query_timeout           = 30

; Idle server connection lifetime (seconds)
server_idle_timeout     = 600

; Client connection lifetime (seconds)
client_idle_timeout     = 0

; Maximum age of a server connection (seconds)
server_lifetime         = 3600

; ----------------------------------------------------------------
; Health checks
; NFR-4.1: auto-recovery from DB failures within 30 seconds
; ----------------------------------------------------------------
; Query sent to server to check it is alive
server_check_query      = SELECT 1

; How often to run server_check_query (seconds)
server_check_delay      = 30

; ----------------------------------------------------------------
; Logging
; ----------------------------------------------------------------
log_connections   = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period      = 60

; Log file (use syslog in production)
logfile           = /var/log/pgbouncer/pgbouncer.log
pidfile           = /var/run/pgbouncer/pgbouncer.pid

; ----------------------------------------------------------------
; Admin interface
; ----------------------------------------------------------------
admin_users       = pgbouncer_admin
stats_users       = pgbouncer_stats

; ----------------------------------------------------------------
; TLS (enable in production)
; ----------------------------------------------------------------
; client_tls_sslmode = require
; client_tls_key_file = /etc/pgbouncer/server.key
; client_tls_cert_file = /etc/pgbouncer/server.crt
; client_tls_ca_file = /etc/pgbouncer/ca.crt
; server_tls_sslmode = require
